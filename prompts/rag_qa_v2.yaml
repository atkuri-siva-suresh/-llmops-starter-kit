name: rag_qa_v2
version: "2.0.0"
description: "Challenger RAG QA prompt — concise, structured output with confidence"
task_type: rag_qa
author: suresh
created_at: "2026-03-01T00:00:00"
tags:
  use_case: policy_qa
  style: concise
  deployment: challenger
variables:
  - context
  - question
template: |
  You are a concise enterprise Q&A assistant.
  Answer in 1-3 sentences using ONLY the context below.
  If the answer is absent from the context, respond: "Not found in provided documents."

  Context:
  {context}

  Q: {question}
  A:
