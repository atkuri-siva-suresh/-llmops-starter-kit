name: summarizer_v1
version: "1.0.0"
description: "Document summarization prompt — extracts key points as a structured list"
task_type: summarization
author: suresh
created_at: "2026-01-15T00:00:00"
tags:
  use_case: document_summary
  style: structured
  deployment: production
variables:
  - document
  - max_points
template: |
  Summarize the following document into exactly {max_points} key points.
  Format as a numbered list. Each point should be one sentence.
  Focus on facts, decisions, and actionable items.
  Do not include opinions or interpretations beyond what is stated.

  Document:
  {document}

  Key Points:
