name: rag_qa_v1
version: "1.0.0"
description: "Baseline RAG QA prompt — verbose, citation-focused, defensive"
task_type: rag_qa
author: suresh
created_at: "2026-01-01T00:00:00"
tags:
  use_case: policy_qa
  style: verbose
  deployment: production
variables:
  - context
  - question
template: |
  You are a precise question-answering assistant for enterprise documents.
  Use ONLY the context provided below to answer the question.
  If the answer is not found in the context, say exactly:
  "I cannot find this information in the provided documents."
  Do not use any external knowledge beyond what is in the context.

  Context:
  {context}

  Question: {question}

  Provide a complete, accurate answer based solely on the context above.

  Answer:
